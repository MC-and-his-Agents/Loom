name: loom-pr-merge-gate

on:
  pull_request:
    branches:
      - main

jobs:
  loom-pr-merge-gate:
    name: loom-pr-merge-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Check authored semantic review approval
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          mkdir -p .loom/runtime/pr
          gh pr view "$PR_NUMBER" \
            --json body,number,state,isDraft,headRefName,headRefOid,baseRefName,url,mergeStateStatus,reviewDecision \
            > .loom/runtime/pr/pr-readback.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path(".loom/runtime/pr/pr-readback.json").read_text(encoding="utf-8"))
          Path(".loom/runtime/pr/pr-body-readback.md").write_text(payload.get("body") or "", encoding="utf-8")
          PY
          args=(
            pr-gate check
            --target .
            --head-sha "$PR_HEAD_SHA"
            --branch "$PR_HEAD_REF"
            --pr-payload-file .loom/runtime/pr/pr-readback.json
            --body-file .loom/runtime/pr/pr-body-readback.md
            --compare-body-file .loom/runtime/pr/pr-body-readback.md
          )
          if [ -n "$PR_NUMBER" ]; then
            args+=(--pr "$PR_NUMBER")
          fi
          python3 tools/loom_flow.py "${args[@]}"
