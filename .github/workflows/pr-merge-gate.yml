name: loom-pr-merge-gate

on:
  pull_request:
    branches:
      - main

jobs:
  loom-pr-merge-gate:
    name: loom-pr-merge-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Check authored semantic review approval
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          mkdir -p .loom/runtime/pr
          gh pr view "$PR_NUMBER" \
            --json body,number,state,isDraft,headRefName,headRefOid,baseRefName,url,mergeStateStatus,reviewDecision \
            > .loom/runtime/pr/pr-readback.json
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          payload = json.loads(Path(".loom/runtime/pr/pr-readback.json").read_text(encoding="utf-8"))
          body = payload.get("body") or ""
          Path(".loom/runtime/pr/pr-body-readback.md").write_text(body, encoding="utf-8")

          surface = "merge_ready"
          for match in re.finditer(r"<!--\s*loom:repo-pr-metadata\s*(.*?)\s*-->", body, re.S):
              try:
                  block = json.loads(match.group(1))
              except json.JSONDecodeError:
                  continue
              if block.get("surface") == "closeout":
                  surface = "closeout"
                  break
          Path(".loom/runtime/pr/pr-gate-surface.txt").write_text(surface, encoding="utf-8")
          PY
          pr_gate_surface="$(cat .loom/runtime/pr/pr-gate-surface.txt)"
          args=(
            pr-gate check
            --target .
            --surface "$pr_gate_surface"
            --head-sha "$PR_HEAD_SHA"
            --branch "$PR_HEAD_REF"
            --pr-payload-file .loom/runtime/pr/pr-readback.json
            --body-file .loom/runtime/pr/pr-body-readback.md
            --compare-body-file .loom/runtime/pr/pr-body-readback.md
          )
          if [ -n "$PR_NUMBER" ]; then
            args+=(--pr "$PR_NUMBER")
          fi
          set +e
          python3 tools/loom_flow.py "${args[@]}" | tee .loom/runtime/pr/pr-gate-output.json
          gate_status="${PIPESTATUS[0]}"
          set -e
          if [ "$gate_status" -ne 0 ] && grep -q 'head_sha_drift' .loom/runtime/pr/pr-gate-output.json; then
            printf '%s\n' "::error title=PR metadata head drift::PR metadata is not bound to current PR head ${PR_HEAD_SHA}. Run: python3 tools/loom.py pr metadata-update ${PR_NUMBER} --target . --surface ${pr_gate_surface} --head-sha ${PR_HEAD_SHA} --branch ${PR_HEAD_REF} --apply --json; then read back with: python3 tools/loom.py pr metadata-readback ${PR_NUMBER} --target . --surface ${pr_gate_surface} --head-sha ${PR_HEAD_SHA} --json; then rerun this failed hosted gate."
          fi
          exit "$gate_status"
