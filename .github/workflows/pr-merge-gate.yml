name: loom-pr-merge-gate

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - edited
      - reopened
      - synchronize

jobs:
  loom-pr-merge-gate:
    name: loom-pr-merge-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Validate native implementation binding
        uses: actions/github-script@v7
        with:
          script: |
            const body = String(context.payload.pull_request.body || "");
            const primaryMatches = [
              ...body.matchAll(/^\s*-\s*Work Item:\s*`?(work_item|fr|phase):(\d+)`?\s*$/gim),
            ];
            if (primaryMatches.length !== 1) {
              throw new Error("implementation PR must declare exactly one `Work Item: work_item:<number>` primary binding");
            }
            const [, locatorType, locatorNumber] = primaryMatches[0];
            if (locatorType !== "work_item") {
              throw new Error(`implementation primary binding must be work_item, not ${locatorType}:${locatorNumber}`);
            }
            const issueNumber = Number(locatorNumber);
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
            });
            const typeLabels = (issue.labels || [])
              .map((label) => typeof label === "string" ? label : label.name)
              .filter((label) => ["work-item", "fr", "phase"].includes(label));
            if (issue.state !== "open" || typeLabels.length !== 1 || typeLabels[0] !== "work-item") {
              throw new Error(`work_item:${issueNumber} must resolve to one open GitHub Work Item`);
            }
            const closingReferences = new Set(
              [...body.matchAll(/\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)\b/gi)]
                .map((match) => Number(match[1])),
            );
            if ([...closingReferences].some((number) => number !== issueNumber)) {
              throw new Error("implementation PR closing references must target its primary work_item; FR/Phase references are not allowed");
            }
            core.notice(`validated work_item:${issueNumber} from GitHub host readback`);
