name: loom-pr-merge-gate

on:
  pull_request:
    branches:
      - main

jobs:
  loom-pr-merge-gate:
    name: loom-pr-merge-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Check authored semantic review approval
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          args=(pr-gate check --target . --head-sha "$PR_HEAD_SHA" --branch "$PR_HEAD_REF")
          if [ -n "$PR_NUMBER" ]; then
            args+=(--pr "$PR_NUMBER")
          fi
          python3 tools/loom_flow.py "${args[@]}"
