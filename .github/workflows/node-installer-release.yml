name: node-installer-release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'packages/loom-installer/**'
      - 'plugins/loom/.codex-plugin/**'
      - 'src/skills/**'
      - 'skills/**'
      - 'tools/skills_surface.py'
      - 'tools/host_adapter_check.py'
      - 'tools/version_surface_check.py'
      - 'README.md'
      - 'README.zh-CN.md'
      - 'docs/adoption/**'
      - 'skills/README.md'
      - 'skills/README.zh-CN.md'
      - 'skills/distribution-and-adapter-contract.md'
      - 'skills/shared/scripts/loom_check.py'
      - '.github/workflows/node-installer-release.yml'
      - '.github/workflows/loom-check.yml'

concurrency:
  group: node-installer-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PACKAGE_NAME: '@mc-and-his-agents/loom-installer'
      PACKAGE_TAG_PREFIX: 'loom-installer-v'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22.14.0'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check doc sync
        run: npm --prefix packages/loom-installer run check:docs

      - name: Check generated skills surface
        run: npm --prefix packages/loom-installer run check:distribution

      - name: Check host adapter matrix
        run: npm --prefix packages/loom-installer run check:hosts

      - name: Check version surfaces
        run: npm --prefix packages/loom-installer run check:versions

      - name: Check payload drift
        run: npm --prefix packages/loom-installer run check:payload

      - name: Run installer regression
        run: node packages/loom-installer/scripts/run-regression.mjs

      - name: Run loom check
        env:
          GH_TOKEN: ${{ github.token }}
        run: make loom-check

      - name: Resolve sunset state
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(node -e "console.log(JSON.parse(require('fs').readFileSync('packages/loom-installer/package.json', 'utf8')).version)")
          TAG="${PACKAGE_TAG_PREFIX}${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          echo "should_publish=false" >> "$GITHUB_OUTPUT"
          echo "create_release=false" >> "$GITHUB_OUTPUT"
          echo "reason=installer-sunset-no-publish" >> "$GITHUB_OUTPUT"
          echo "published_latest=$(npm view "${PACKAGE_NAME}" version 2>/dev/null || true)" >> "$GITHUB_OUTPUT"
          echo "deprecated_status=$(npm view "${PACKAGE_NAME}" deprecated 2>/dev/null || true)" >> "$GITHUB_OUTPUT"
          echo "installer release is sunset: package publication, ${TAG} creation, and installer GitHub Release creation are disabled."
