name: loom-cli-release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Create the VERSION tag and GitHub Release when CLI release is required.'
        required: true
        type: boolean
        default: false
      release_issue:
        description: 'Open release Work Item used by host-native release admission.'
        required: false
        type: string
      acceptance_artifact_id:
        description: 'Trusted umbrella acceptance artifact bound to the release head.'
        required: false
        type: string
  pull_request:
    paths:
      - 'Makefile'
      - '.github/actions/**'
      - '.github/workflows/**'
      - 'VERSION'
      - 'package.json'
      - 'bin/loom.mjs'
      - 'tools/loom.py'
      - 'tools/loom_*.py'
      - 'tools/check_cli_contract.py'
      - 'tools/check_*.py'
      - 'tools/fixtures/**'
      - 'test/**'
      - 'tools/check_npm_package.py'
      - 'tools/check_release_surface.py'
      - 'tools/build_distribution.py'
      - 'tools/version_surface_check.py'
      - 'test/**'
      - 'src/skills/**'
      - 'skills/**'
      - 'plugins/loom/skills/**'
      - 'docs/adoption/loom-cli-release-surface.md'
      - 'docs/adoption/version-authority-map.md'
      - 'README.md'
      - 'README.zh-CN.md'
      - '.github/workflows/loom-cli-release.yml'
  push:
    branches:
      - main
    paths:
      - 'VERSION'
      - 'package.json'
      - 'bin/loom.mjs'
      - 'tools/loom.py'
      - 'tools/loom_*.py'
      - 'tools/check_cli_contract.py'
      - 'tools/check_npm_package.py'
      - 'tools/check_release_surface.py'
      - 'tools/build_distribution.py'
      - 'tools/version_surface_check.py'
      - 'src/skills/**'
      - 'skills/**'
      - 'plugins/loom/skills/**'
      - 'docs/adoption/loom-cli-release-surface.md'
      - 'docs/adoption/version-authority-map.md'
      - 'README.md'
      - 'README.zh-CN.md'
      - '.github/workflows/loom-cli-release.yml'

concurrency:
  group: loom-cli-release
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  release-judgment:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      publish_allowed: ${{ steps.state.outputs.publish_allowed }}
      should_publish: ${{ steps.state.outputs.should_publish }}
      create_release: ${{ steps.state.outputs.create_release }}
      npm_publish: ${{ steps.state.outputs.npm_publish }}
      tag: ${{ steps.state.outputs.tag }}
      release_title: ${{ steps.state.outputs.release_title }}
      npm_package: ${{ steps.state.outputs.npm_package }}
      npm_version: ${{ steps.state.outputs.npm_version }}
    env:
      PACKAGE_TAG_PREFIX: 'v'
      NPM_PACKAGE_NAME: '@mc-and-his-agents/loom'
      PUBLISH_REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.publish == true }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Check release surfaces
        run: python3 tools/check_release_surface.py

      - name: Check version surfaces
        run: python3 tools/version_surface_check.py

      - name: Check npm package contract
        run: python3 tools/check_npm_package.py

      - name: Smoke-test the packed public CLI
        run: npm run test:package

      - name: Resolve CLI release state
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(tr -d '\n' < VERSION)
          TAG="${VERSION}"
          NPM_VERSION="${VERSION#v}"
          RELEASE_TITLE="Loom CLI ${VERSION}"
          PUBLISH_ALLOWED=false
          if [ "$PUBLISH_REQUESTED" = "true" ]; then
            PUBLISH_ALLOWED=true
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "npm_package=${NPM_PACKAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "npm_version=${NPM_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "release_title=${RELEASE_TITLE}" >> "$GITHUB_OUTPUT"
          echo "publish_allowed=${PUBLISH_ALLOWED}" >> "$GITHUB_OUTPUT"

          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [ "$PACKAGE_VERSION" != "$NPM_VERSION" ]; then
            echo "release state is inconsistent: package.json version ${PACKAGE_VERSION} does not match VERSION ${VERSION}" >&2
            exit 1
          fi

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}"
            CHANGED_FILES=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          elif [ "${{ github.event_name }}" = "push" ]; then
            CHANGED_FILES=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")
          else
            CHANGED_FILES=$(git diff --name-only "HEAD^..HEAD" 2>/dev/null || true)
          fi

          if [ "$PUBLISH_REQUESTED" = "true" ] || printf '%s\n' "$CHANGED_FILES" | grep -E '^(VERSION|package\\.json|bin/loom\\.mjs|tools/loom\\.py|tools/loom_.*\\.py|tools/build_distribution\\.py|src/skills/)' >/dev/null; then
            echo "cli_publish_behavior_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "cli_publish_behavior_changed=false" >> "$GITHUB_OUTPUT"
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "create_release=false" >> "$GITHUB_OUTPUT"
            echo "npm_publish=false" >> "$GITHUB_OUTPUT"
            echo "reason=no-cli-behavior-change" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TAG_EXISTS=false
          TAG_MATCHES=false
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            TAG_EXISTS=true
            TAG_SHA=$(git rev-list -n 1 "refs/tags/${TAG}")
            if [ "$TAG_SHA" = "${{ github.sha }}" ]; then
              TAG_MATCHES=true
            fi
          fi

          RELEASE_EXISTS=false
          if gh release view "$TAG" >/dev/null 2>&1; then
            RELEASE_EXISTS=true
          fi

          NPM_VERSION_EXISTS=false
          NPM_LATEST=$(npm view "${NPM_PACKAGE_NAME}" version 2>/dev/null || true)
          if npm view "${NPM_PACKAGE_NAME}@${NPM_VERSION}" version >/dev/null 2>&1; then
            NPM_VERSION_EXISTS=true
          fi
          echo "npm_latest=${NPM_LATEST}" >> "$GITHUB_OUTPUT"

          if [ "$PUBLISH_ALLOWED" != true ]; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "create_release=false" >> "$GITHUB_OUTPUT"
            echo "npm_publish=false" >> "$GITHUB_OUTPUT"
            echo "reason=release-judgment-only" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$TAG_MATCHES" != true ] && [ "$TAG_EXISTS" = true ]; then
            if [ "$PUBLISH_REQUESTED" != "true" ]; then
              echo "should_publish=false" >> "$GITHUB_OUTPUT"
              echo "create_release=false" >> "$GITHUB_OUTPUT"
              echo "npm_publish=false" >> "$GITHUB_OUTPUT"
              echo "reason=release_pending" >> "$GITHUB_OUTPUT"
              echo "Loom CLI ${TAG} is already published on an earlier commit; keep this source change pending until a new, unoccupied VERSION is merged" >&2
              exit 0
            fi
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "create_release=false" >> "$GITHUB_OUTPUT"
            echo "npm_publish=false" >> "$GITHUB_OUTPUT"
            echo "reason=version-already-published-on-different-commit" >> "$GITHUB_OUTPUT"
            echo "release state is inconsistent: Loom CLI tag ${TAG} does not point to ${{ github.sha }}; bump VERSION to a new unpublished v* before publishing CLI behavior" >&2
            exit 1
          fi

          if [ "$TAG_EXISTS" = false ]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "create_release=true" >> "$GITHUB_OUTPUT"
            if [ "$NPM_VERSION_EXISTS" = true ]; then
              echo "npm_publish=false" >> "$GITHUB_OUTPUT"
              echo "reason=tag-release-missing-npm-version-exists" >> "$GITHUB_OUTPUT"
            else
              echo "npm_publish=true" >> "$GITHUB_OUTPUT"
              echo "reason=publish-required" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          echo "should_publish=true" >> "$GITHUB_OUTPUT"
          if [ "$RELEASE_EXISTS" = true ]; then
            echo "create_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "create_release=true" >> "$GITHUB_OUTPUT"
          fi
          if [ "$NPM_VERSION_EXISTS" = true ]; then
            echo "npm_publish=false" >> "$GITHUB_OUTPUT"
            if [ "$RELEASE_EXISTS" = true ]; then
              echo "reason=already-published-and-released" >> "$GITHUB_OUTPUT"
            else
              echo "reason=release-missing" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "npm_publish=true" >> "$GITHUB_OUTPUT"
            echo "reason=npm-version-missing" >> "$GITHUB_OUTPUT"
          fi

  release-admission:
    needs: release-judgment
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish == true }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: read
    steps:
      - name: Checkout current release head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Read live release scope
        id: snapshot
        uses: actions/github-script@v7
        env:
          RELEASE_ISSUE: ${{ inputs.release_issue }}
        with:
          script: |
            const fs = require("fs");
            const issueNumber = Number(process.env.RELEASE_ISSUE);
            const defaultBranch = context.payload.repository.default_branch;
            const query = `
              query($owner:String!, $repo:String!, $number:Int!) {
                repository(owner:$owner, name:$repo) {
                  issue(number:$number) {
                    number state stateReason
                    labels(first:100) { pageInfo { hasNextPage } nodes { name } }
                    milestone { number }
                    blockedBy(first:100) { pageInfo { hasNextPage } nodes { number state stateReason } }
                  }
                }
              }
            `;
            let readComplete = Number.isInteger(issueNumber) && issueNumber > 0;
            let issue = null;
            let milestoneIssues = [];
            let acceptanceArtifactId = null;
            let branch = null;
            if (readComplete) {
              try {
                const [data, branchResponse] = await Promise.all([
                  github.graphql(query, { owner: context.repo.owner, repo: context.repo.repo, number: issueNumber }),
                  github.rest.repos.getBranch({ owner: context.repo.owner, repo: context.repo.repo, branch: defaultBranch }),
                ]);
                issue = data?.repository?.issue;
                branch = branchResponse.data;
                readComplete = Boolean(issue && !issue.labels?.pageInfo?.hasNextPage && !issue.blockedBy?.pageInfo?.hasNextPage && Number.isInteger(issue.milestone?.number));
                if (readComplete) {
                  const [issues, comments] = await Promise.all([
                    github.paginate(github.rest.issues.listForRepo, {
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      milestone: String(issue.milestone.number),
                      state: "all",
                      per_page: 100,
                    }),
                    github.paginate(github.rest.issues.listComments, {
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      issue_number: issueNumber,
                      per_page: 100,
                    }),
                  ]);
                  milestoneIssues = issues;
                  const marker = /<!--\s*loom:product-acceptance-artifact\s+id:(\d+)\s*-->/i;
                  const locators = comments
                    .filter((comment) => comment.user?.login === "github-actions[bot]")
                    .map((comment) => String(comment.body || "").match(marker))
                    .filter(Boolean)
                    .map((match) => Number(match[1]));
                  acceptanceArtifactId = locators.length === 1 && Number.isInteger(locators[0]) && locators[0] > 0
                    ? locators[0]
                    : null;
                }
              } catch (error) {
                readComplete = false;
                core.warning(`release scope read failed: ${error.message}`);
              }
            }
            const snapshot = {
              repository: `${context.repo.owner}/${context.repo.repo}`,
              ref: context.ref,
              head_sha: context.sha,
              default_branch: defaultBranch,
              default_branch_tip: branch?.commit?.sha || null,
              read_complete: readComplete,
              release_issue: issue ? {
                number: issue.number,
                state: issue.state,
                state_reason: issue.stateReason,
                labels: issue.labels.nodes.map((entry) => entry.name),
                milestone_number: issue.milestone.number,
                blocked_by: issue.blockedBy.nodes.map((entry) => ({ number: entry.number, state: entry.state, state_reason: entry.stateReason })),
              } : null,
              acceptance_artifact_id: acceptanceArtifactId,
              milestone_issues: milestoneIssues
                .filter((entry) => !entry.pull_request)
                .map((entry) => ({
                  number: entry.number,
                  state: String(entry.state || "").toUpperCase(),
                  state_reason: String(entry.state_reason || "").toUpperCase(),
                  labels: (entry.labels || []).map((label) => label.name || label),
                })),
            };
            const path = `${process.env.RUNNER_TEMP}/loom-release-snapshot.json`;
            fs.writeFileSync(path, JSON.stringify(snapshot));
            core.setOutput("path", path);

      - name: Resolve trusted umbrella acceptance
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ISSUE: ${{ inputs.release_issue }}
          ARTIFACT_ID: ${{ inputs.acceptance_artifact_id }}
          SNAPSHOT_PATH: ${{ steps.snapshot.outputs.path }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_ISSUE" =~ ^[1-9][0-9]*$ ]]
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          python3 tools/loom.py acceptance resolve \
            --story "${{ github.repository }}/issue/${RELEASE_ISSUE}" \
            --artifact-id "$ARTIFACT_ID" \
            --json > "${RUNNER_TEMP}/loom-release-acceptance.json"
          python3 tools/release_admission.py \
            --snapshot "$SNAPSHOT_PATH" \
            --acceptance "${RUNNER_TEMP}/loom-release-acceptance.json" \
            --output "${RUNNER_TEMP}/loom-release-admission.json"

  release-publisher:
    needs: [release-judgment, release-admission]
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.publish == true &&
      needs.release-judgment.outputs.publish_allowed == 'true' &&
      needs.release-judgment.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      issues: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Reconfirm live release scope before publishing
        uses: actions/github-script@v7
        env:
          RELEASE_ISSUE: ${{ inputs.release_issue }}
          ARTIFACT_ID: ${{ inputs.acceptance_artifact_id }}
        with:
          script: |
            const issueNumber = Number(process.env.RELEASE_ISSUE);
            const artifactId = Number(process.env.ARTIFACT_ID);
            const defaultBranch = context.payload.repository.default_branch;
            if (!Number.isInteger(issueNumber) || !Number.isInteger(artifactId) || artifactId <= 0) {
              core.setFailed("release publication requires valid release issue and acceptance artifact inputs");
              return;
            }
            const query = `
              query($owner:String!, $repo:String!, $number:Int!) {
                repository(owner:$owner, name:$repo) {
                  issue(number:$number) {
                    number state
                    labels(first:100) { pageInfo { hasNextPage } nodes { name } }
                    milestone { number }
                    blockedBy(first:100) { pageInfo { hasNextPage } nodes { state stateReason } }
                  }
                }
              }
            `;
            const [data, branch, comments] = await Promise.all([
              github.graphql(query, { owner: context.repo.owner, repo: context.repo.repo, number: issueNumber }),
              github.rest.repos.getBranch({ owner: context.repo.owner, repo: context.repo.repo, branch: defaultBranch }),
              github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner, repo: context.repo.repo, issue_number: issueNumber, per_page: 100,
              }),
            ]);
            const issue = data?.repository?.issue;
            const labels = issue?.labels?.nodes?.map((entry) => String(entry.name || "").toLowerCase()) || [];
            const blockers = issue?.blockedBy?.nodes || [];
            const marker = /<!--\s*loom:product-acceptance-artifact\s+id:(\d+)\s*-->/i;
            const markerIds = comments
              .filter((comment) => comment.user?.login === "github-actions[bot]")
              .map((comment) => String(comment.body || "").match(marker))
              .filter(Boolean)
              .map((match) => Number(match[1]));
            if (
              branch.data.commit?.sha !== context.sha || !issue || issue.state !== "OPEN" ||
              !labels.includes("work-item") || issue.labels?.pageInfo?.hasNextPage ||
              issue.blockedBy?.pageInfo?.hasNextPage || !Number.isInteger(issue.milestone?.number) ||
              blockers.some((entry) => entry.state !== "CLOSED" || entry.stateReason !== "COMPLETED") ||
              markerIds.length !== 1 || markerIds[0] !== artifactId
            ) {
              core.setFailed("live release head, Work Item, dependencies, or acceptance locator changed after admission");
              return;
            }
            const milestoneIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner, repo: context.repo.repo,
              milestone: String(issue.milestone.number), state: "all", per_page: 100,
            });
            const releaseRows = milestoneIssues.filter((entry) => !entry.pull_request && entry.number === issueNumber);
            const incomplete = milestoneIssues.find((entry) => {
              if (entry.number === issueNumber || entry.pull_request) return false;
              const names = new Set((entry.labels || []).map((label) => String(label.name || label).toLowerCase()));
              return (names.has("fr") || names.has("work-item")) && (entry.state !== "closed" || entry.state_reason !== "completed");
            });
            if (releaseRows.length !== 1 || incomplete) {
              core.setFailed(`live milestone release scope changed after admission${incomplete ? ` at issue:${incomplete.number}` : ""}`);
            }

      - name: Prepare exact release npm payload
        run: |
          set -euo pipefail
          python3 tools/stamp_plugin_payload_metadata.py --source-git-sha "${{ github.sha }}" --write --json
          python3 tools/check_npm_package.py
          npm pack --dry-run --json --ignore-scripts
          EXPECTED_PLUGIN_PAYLOAD_HASH=$(jq -er '.["x-loom"].plugin_payload_hash' plugins/loom/.codex-plugin/plugin.json)
          echo "EXPECTED_PLUGIN_PAYLOAD_HASH=${EXPECTED_PLUGIN_PAYLOAD_HASH}" >> "$GITHUB_ENV"

      - name: Create git tag
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git rev-parse -q --verify "refs/tags/${{ needs.release-judgment.outputs.tag }}" >/dev/null; then
            echo "tag ${{ needs.release-judgment.outputs.tag }} already exists on this commit"
          else
            git tag -a "${{ needs.release-judgment.outputs.tag }}" -m "Release ${{ needs.release-judgment.outputs.tag }}"
            git push origin "${{ needs.release-judgment.outputs.tag }}"
          fi

      - name: Publish npm package
        if: needs.release-judgment.outputs.npm_publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NPM_TOKEN secret is required to publish ${{ needs.release-judgment.outputs.npm_package }}@${{ needs.release-judgment.outputs.npm_version }}" >&2
            exit 1
          fi
          npm whoami
          npm publish --access public --provenance

      - name: Read back published npm payload
        env:
          NPM_PACKAGE_NAME: ${{ needs.release-judgment.outputs.npm_package }}
          NPM_VERSION: ${{ needs.release-judgment.outputs.npm_version }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          READBACK_ROOT=$(mktemp -d)
          trap 'rm -rf "$READBACK_ROOT"' EXIT
          cd "$READBACK_ROOT"
          PACK_JSON=""
          for attempt in 1 2 3 4 5 6; do
            if PACK_JSON=$(npm pack "${NPM_PACKAGE_NAME}@${NPM_VERSION}" --json --ignore-scripts); then
              break
            fi
            if [ "$attempt" = 6 ]; then
              echo "published npm payload was not readable after ${attempt} attempts" >&2
              exit 1
            fi
            sleep 5
          done
          TARBALL=$(printf '%s' "$PACK_JSON" | jq -er '.[0].filename')
          tar -xzf "$TARBALL"
          MANIFEST=package/plugins/loom/.codex-plugin/plugin.json
          test "$(jq -er '.["x-loom"].source_git_sha' "$MANIFEST")" = "$RELEASE_SHA"
          test "$(jq -er '.["x-loom"].source_package_version' "$MANIFEST")" = "$NPM_VERSION"
          test "$(jq -er '.["x-loom"].plugin_payload_version' "$MANIFEST")" = "$NPM_VERSION"
          test "$(jq -er '.["x-loom"].plugin_payload_hash' "$MANIFEST")" = "$EXPECTED_PLUGIN_PAYLOAD_HASH"
          PYTHONDONTWRITEBYTECODE=1 \
            python3 package/tools/check_npm_package.py \
              --surface plugin-payload-hash \
              --plugin-payload-root package/plugins/loom

      - name: Create GitHub release
        if: needs.release-judgment.outputs.create_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ needs.release-judgment.outputs.tag }}" --title "${{ needs.release-judgment.outputs.release_title }}" --generate-notes
