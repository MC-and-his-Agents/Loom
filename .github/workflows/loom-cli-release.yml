name: loom-cli-release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Create the VERSION tag and GitHub Release when CLI release is required.'
        required: true
        type: boolean
        default: false
  pull_request:
    paths:
      - 'VERSION'
      - 'package.json'
      - 'bin/loom.mjs'
      - 'tools/loom.py'
      - 'tools/loom_*.py'
      - 'tools/check_cli_contract.py'
      - 'tools/check_npm_package.py'
      - 'tools/check_release_surface.py'
      - 'tools/build_distribution.py'
      - 'tools/version_surface_check.py'
      - 'src/skills/**'
      - 'docs/adoption/loom-cli-release-surface.md'
      - 'docs/adoption/version-authority-map.md'
      - 'README.md'
      - 'README.zh-CN.md'
      - '.github/workflows/loom-cli-release.yml'
  push:
    branches:
      - main
    paths:
      - 'VERSION'
      - 'package.json'
      - 'bin/loom.mjs'
      - 'tools/loom.py'
      - 'tools/loom_*.py'
      - 'tools/check_cli_contract.py'
      - 'tools/check_npm_package.py'
      - 'tools/check_release_surface.py'
      - 'tools/build_distribution.py'
      - 'tools/version_surface_check.py'
      - 'src/skills/**'
      - 'docs/adoption/loom-cli-release-surface.md'
      - 'docs/adoption/version-authority-map.md'
      - 'README.md'
      - 'README.zh-CN.md'
      - '.github/workflows/loom-cli-release.yml'

concurrency:
  group: loom-cli-release
  cancel-in-progress: false

jobs:
  release-judgment:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      publish_allowed: ${{ steps.state.outputs.publish_allowed }}
      should_publish: ${{ steps.state.outputs.should_publish }}
      create_release: ${{ steps.state.outputs.create_release }}
      npm_publish: ${{ steps.state.outputs.npm_publish }}
      tag: ${{ steps.state.outputs.tag }}
      release_title: ${{ steps.state.outputs.release_title }}
      npm_package: ${{ steps.state.outputs.npm_package }}
      npm_version: ${{ steps.state.outputs.npm_version }}
    env:
      PACKAGE_TAG_PREFIX: 'v'
      NPM_PACKAGE_NAME: '@mc-and-his-agents/loom'
      PUBLISH_REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.publish == true }}
      AUTO_PUBLISH_ALLOWED: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Check release surfaces
        run: python3 tools/check_release_surface.py

      - name: Check version surfaces
        run: python3 tools/version_surface_check.py

      - name: Check CLI contract
        if: ${{ github.event_name != 'pull_request' }}
        run: python3 tools/check_cli_contract.py

      - name: Check host-native lifecycle contracts
        if: ${{ github.event_name == 'pull_request' }}
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: make loom-check

      - name: Check npm package contract
        run: python3 tools/check_npm_package.py

      - name: Dry-run npm package payload
        run: npm pack --dry-run --json --ignore-scripts

      - name: Resolve CLI release state
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(tr -d '\n' < VERSION)
          TAG="${VERSION}"
          NPM_VERSION="${VERSION#v}"
          RELEASE_TITLE="Loom CLI ${VERSION}"
          PUBLISH_ALLOWED=false
          if [ "$AUTO_PUBLISH_ALLOWED" = "true" ] || [ "$PUBLISH_REQUESTED" = "true" ]; then
            PUBLISH_ALLOWED=true
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "npm_package=${NPM_PACKAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "npm_version=${NPM_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "release_title=${RELEASE_TITLE}" >> "$GITHUB_OUTPUT"
          echo "publish_allowed=${PUBLISH_ALLOWED}" >> "$GITHUB_OUTPUT"

          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [ "$PACKAGE_VERSION" != "$NPM_VERSION" ]; then
            echo "release state is inconsistent: package.json version ${PACKAGE_VERSION} does not match VERSION ${VERSION}" >&2
            exit 1
          fi

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}"
            CHANGED_FILES=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          elif [ "${{ github.event_name }}" = "push" ]; then
            CHANGED_FILES=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")
          else
            CHANGED_FILES=$(git diff --name-only "HEAD^..HEAD" 2>/dev/null || true)
          fi

          if [ "$PUBLISH_REQUESTED" = "true" ] || printf '%s\n' "$CHANGED_FILES" | grep -E '^(VERSION|package\\.json|bin/loom\\.mjs|tools/loom\\.py|tools/loom_.*\\.py|tools/build_distribution\\.py|src/skills/)' >/dev/null; then
            echo "cli_publish_behavior_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "cli_publish_behavior_changed=false" >> "$GITHUB_OUTPUT"
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "create_release=false" >> "$GITHUB_OUTPUT"
            echo "npm_publish=false" >> "$GITHUB_OUTPUT"
            echo "reason=no-cli-behavior-change" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TAG_EXISTS=false
          TAG_MATCHES=false
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            TAG_EXISTS=true
            TAG_SHA=$(git rev-list -n 1 "refs/tags/${TAG}")
            if [ "$TAG_SHA" = "${{ github.sha }}" ]; then
              TAG_MATCHES=true
            fi
          fi

          RELEASE_EXISTS=false
          if gh release view "$TAG" >/dev/null 2>&1; then
            RELEASE_EXISTS=true
          fi

          NPM_VERSION_EXISTS=false
          NPM_LATEST=$(npm view "${NPM_PACKAGE_NAME}" version 2>/dev/null || true)
          if npm view "${NPM_PACKAGE_NAME}@${NPM_VERSION}" version >/dev/null 2>&1; then
            NPM_VERSION_EXISTS=true
          fi
          echo "npm_latest=${NPM_LATEST}" >> "$GITHUB_OUTPUT"

          if [ "$PUBLISH_ALLOWED" != true ]; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "create_release=false" >> "$GITHUB_OUTPUT"
            echo "npm_publish=false" >> "$GITHUB_OUTPUT"
            echo "reason=release-judgment-only" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$TAG_MATCHES" != true ] && [ "$TAG_EXISTS" = true ]; then
            if [ "$PUBLISH_REQUESTED" != "true" ]; then
              echo "should_publish=false" >> "$GITHUB_OUTPUT"
              echo "create_release=false" >> "$GITHUB_OUTPUT"
              echo "npm_publish=false" >> "$GITHUB_OUTPUT"
              echo "reason=release_pending" >> "$GITHUB_OUTPUT"
              echo "Loom CLI ${TAG} is already published on an earlier commit; keep this source change pending until a new, unoccupied VERSION is merged" >&2
              exit 0
            fi
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "create_release=false" >> "$GITHUB_OUTPUT"
            echo "npm_publish=false" >> "$GITHUB_OUTPUT"
            echo "reason=version-already-published-on-different-commit" >> "$GITHUB_OUTPUT"
            echo "release state is inconsistent: Loom CLI tag ${TAG} does not point to ${{ github.sha }}; bump VERSION to a new unpublished v* before publishing CLI behavior" >&2
            exit 1
          fi

          if [ "$TAG_EXISTS" = false ]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "create_release=true" >> "$GITHUB_OUTPUT"
            if [ "$NPM_VERSION_EXISTS" = true ]; then
              echo "npm_publish=false" >> "$GITHUB_OUTPUT"
              echo "reason=tag-release-missing-npm-version-exists" >> "$GITHUB_OUTPUT"
            else
              echo "npm_publish=true" >> "$GITHUB_OUTPUT"
              echo "reason=publish-required" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          echo "should_publish=true" >> "$GITHUB_OUTPUT"
          if [ "$RELEASE_EXISTS" = true ]; then
            echo "create_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "create_release=true" >> "$GITHUB_OUTPUT"
          fi
          if [ "$NPM_VERSION_EXISTS" = true ]; then
            echo "npm_publish=false" >> "$GITHUB_OUTPUT"
            if [ "$RELEASE_EXISTS" = true ]; then
              echo "reason=already-published-and-released" >> "$GITHUB_OUTPUT"
            else
              echo "reason=release-missing" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "npm_publish=true" >> "$GITHUB_OUTPUT"
            echo "reason=npm-version-missing" >> "$GITHUB_OUTPUT"
          fi

  release-publisher:
    needs: release-judgment
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main' ||
      github.event_name == 'workflow_dispatch' && inputs.publish == true) &&
      needs.release-judgment.outputs.publish_allowed == 'true' &&
      needs.release-judgment.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Create git tag
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git rev-parse -q --verify "refs/tags/${{ needs.release-judgment.outputs.tag }}" >/dev/null; then
            echo "tag ${{ needs.release-judgment.outputs.tag }} already exists on this commit"
          else
            git tag -a "${{ needs.release-judgment.outputs.tag }}" -m "Release ${{ needs.release-judgment.outputs.tag }}"
            git push origin "${{ needs.release-judgment.outputs.tag }}"
          fi

      - name: Publish npm package
        if: needs.release-judgment.outputs.npm_publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NPM_TOKEN secret is required to publish ${{ needs.release-judgment.outputs.npm_package }}@${{ needs.release-judgment.outputs.npm_version }}" >&2
            exit 1
          fi
          python3 tools/stamp_plugin_payload_metadata.py --source-git-sha "${{ github.sha }}" --write --json
          python3 tools/check_npm_package.py
          npm pack --dry-run --json --ignore-scripts
          npm whoami
          npm publish --access public --provenance

      - name: Create GitHub release
        if: needs.release-judgment.outputs.create_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ needs.release-judgment.outputs.tag }}" --title "${{ needs.release-judgment.outputs.release_title }}" --generate-notes
