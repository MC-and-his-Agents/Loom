name: loom-product-acceptance

on:
  workflow_dispatch:
    inputs:
      story_issue:
        description: 'v0.31 FR receiving this product acceptance verdict.'
        required: true
        type: choice
        options:
          - '2100'
          - '2101'

permissions:
  actions: read
  contents: read

concurrency:
  group: loom-product-acceptance-${{ inputs.story_issue }}
  cancel-in-progress: false

jobs:
  product-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bind default branch and verifier
        id: authority
        uses: actions/github-script@v7
        with:
          script: |
            if (context.ref !== `refs/heads/${context.payload.repository.default_branch}`) {
              core.setFailed("product acceptance must run from the default branch");
              return;
            }
            const verifier = await github.rest.users.getByUsername({
              username: process.env.GITHUB_TRIGGERING_ACTOR,
            });
            core.setOutput("verifier_id", String(verifier.data.id));

      - name: Run v0.31 product acceptance matrix
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 tools/check_authority_contract.py
          python3 tools/check_light_profile.py
          python3 tools/check_host_attestation.py
          python3 tools/check_product_acceptance_adapter.py
          python3 tools/check_delivery_gate.py
          python3 tools/check_cli_contract.py
          python3 tools/skills_surface.py check
          python3 tools/check_release_surface.py
          python3 tools/check_npm_package.py
          npm run test:package

      - name: Read back published v0.31 release
        if: ${{ inputs.story_issue == '2101' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 tools/loom.py release readback \
            --target . \
            --version v0.31.0 \
            --commit "$GITHUB_SHA" \
            --repo "$GITHUB_REPOSITORY" \
            --release-judgment release_required \
            --json > "$RUNNER_TEMP/loom-v0.31-release-readback.json"

      - name: Write host-bound acceptance record
        env:
          STORY: MC-and-his-Agents/Loom/issue/${{ inputs.story_issue }}
          SCENARIO: v0.31-product-acceptance-${{ inputs.story_issue }}
          EVIDENCE_CLASS: ${{ inputs.story_issue == '2101' && 'live_readonly' || 'contract_test' }}
          PROVIDER_PROFILE: loom-v0.31-product-acceptance
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          VERIFIER_LOGIN: ${{ github.triggering_actor }}
          VERIFIER_ID: ${{ steps.authority.outputs.verifier_id }}
        run: |
          writer_args=(
            --story "$STORY"
            --scenario "$SCENARIO"
            --evidence-class "$EVIDENCE_CLASS"
            --provider-profile "$PROVIDER_PROFILE"
            --repository "$REPOSITORY"
            --head-sha "$HEAD_SHA"
            --run-id "$RUN_ID"
            --verifier-login "$VERIFIER_LOGIN"
            --verifier-id "$VERIFIER_ID"
            --output acceptance.json
          )
          if [ "$EVIDENCE_CLASS" = "live_readonly" ]; then
            writer_args+=(--release-readback "$RUNNER_TEMP/loom-v0.31-release-readback.json")
          fi
          python3 tools/write_product_acceptance.py "${writer_args[@]}"

      - name: Upload product acceptance
        uses: actions/upload-artifact@v4
        with:
          name: loom-product-acceptance
          path: acceptance.json
          if-no-files-found: error
          retention-days: 30
