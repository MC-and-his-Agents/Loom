name: loom-product-acceptance

on:
  workflow_dispatch:
    inputs:
      release_issue:
        description: 'Open release Work Item receiving the umbrella acceptance verdict.'
        required: true
        type: string

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: loom-product-acceptance-${{ github.sha }}
  cancel-in-progress: false

jobs:
  product-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bind current release scope, aggregate, and verifier
        id: authority
        uses: actions/github-script@v7
        env:
          RELEASE_ISSUE: ${{ inputs.release_issue }}
        with:
          script: |
            const issueNumber = Number(process.env.RELEASE_ISSUE);
            const defaultBranch = context.payload.repository.default_branch;
            if (!Number.isInteger(issueNumber) || issueNumber <= 0) {
              core.setFailed("release_issue must be a positive GitHub issue number");
              return;
            }
            if (context.ref !== `refs/heads/${defaultBranch}`) {
              core.setFailed("product acceptance must run from the default branch");
              return;
            }
            const { data: branch } = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: defaultBranch,
            });
            if (branch.commit?.sha !== context.sha) {
              core.setFailed("product acceptance must bind the current default-branch tip");
              return;
            }
            const query = `
              query($owner:String!, $repo:String!, $number:Int!) {
                repository(owner:$owner, name:$repo) {
                  issue(number:$number) {
                    number state stateReason
                    labels(first:100) { pageInfo { hasNextPage } nodes { name } }
                    milestone { number }
                    blockedBy(first:100) { pageInfo { hasNextPage } nodes { number state stateReason } }
                  }
                }
              }
            `;
            const data = await github.graphql(query, { owner: context.repo.owner, repo: context.repo.repo, number: issueNumber });
            const issue = data?.repository?.issue;
            const labels = issue?.labels?.nodes?.map((entry) => String(entry.name || "").toLowerCase()) || [];
            const blockers = issue?.blockedBy?.nodes || [];
            if (
              !issue || issue.state !== "OPEN" || !labels.includes("work-item") ||
              issue.labels?.pageInfo?.hasNextPage || issue.blockedBy?.pageInfo?.hasNextPage ||
              !Number.isInteger(issue.milestone?.number) ||
              blockers.some((entry) => entry.state !== "CLOSED" || entry.stateReason !== "COMPLETED")
            ) {
              core.setFailed("release Work Item, labels, milestone, or native dependencies are not ready");
              return;
            }
            const acceptanceMarker = /<!--\s*loom:product-acceptance-artifact\s+id:(\d+)\s*-->/i;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              per_page: 100,
            });
            const markerIds = comments
              .filter((comment) => comment.user?.login === "github-actions[bot]")
              .map((comment) => String(comment.body || "").match(acceptanceMarker))
              .filter(Boolean)
              .map((match) => Number(match[1]));
            if (markerIds.length > 1) {
              core.setFailed(`issue:${issueNumber} has ambiguous workflow-owned product acceptance locators`);
              return;
            }
            if (markerIds.length === 1) {
              try {
                const { data: artifact } = await github.rest.actions.getArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: markerIds[0],
                });
                const runId = artifact.workflow_run?.id;
                const { data: run } = await github.rest.actions.getWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: runId,
                });
                if (
                  !artifact.expired && artifact.name === "loom-product-acceptance" &&
                  run.path === ".github/workflows/loom-product-acceptance.yml" && run.event === "workflow_dispatch" &&
                  run.head_sha === context.sha && run.conclusion === "success"
                ) {
                  core.setFailed(`issue:${issueNumber} already has current-head umbrella acceptance artifact:${artifact.id}`);
                  return;
                }
              } catch (error) {
                if (error.status === 404) {
                  core.notice(`existing acceptance locator no longer exists and will be replaced: ${error.message}`);
                } else {
                  core.setFailed(`existing acceptance locator readback failed: ${error.message}`);
                  return;
                }
              }
            }
            const milestoneIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              milestone: String(issue.milestone.number),
              state: "all",
              per_page: 100,
            });
            const incomplete = milestoneIssues.find((entry) => {
              if (entry.number === issueNumber || entry.pull_request) return false;
              const names = new Set((entry.labels || []).map((label) => String(label.name || label).toLowerCase()));
              return (names.has("fr") || names.has("work-item")) && (entry.state !== "closed" || entry.state_reason !== "completed");
            });
            if (incomplete) {
              core.setFailed(`milestone release scope is incomplete at issue:${incomplete.number}`);
              return;
            }
            if (milestoneIssues.filter((entry) => !entry.pull_request && entry.number === issueNumber).length !== 1) {
              core.setFailed("milestone readback must contain the release Work Item exactly once");
              return;
            }
            const aggregateRuns = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "loom-check.yml",
              branch: defaultBranch,
              event: "push",
              head_sha: context.sha,
              per_page: 100,
            });
            const exactHeadRuns = aggregateRuns
              .filter((run) => run.head_sha === context.sha)
              .sort((left, right) => (right.run_number - left.run_number) || (right.id - left.id));
            const aggregate = exactHeadRuns[0];
            if (!aggregate || aggregate.status !== "completed" || aggregate.conclusion !== "success") {
              core.setFailed("latest current-head main-push loom-check aggregate is not completed successfully");
              return;
            }
            const verifier = await github.rest.users.getByUsername({ username: process.env.GITHUB_TRIGGERING_ACTOR });
            core.setOutput("verifier_id", String(verifier.data.id));
            core.notice(`consumed aggregate run ${aggregate.id} for ${context.sha}`);

      - name: Stamp exact release plugin payload
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 tools/stamp_plugin_payload_metadata.py \
            --source-git-sha "$GITHUB_SHA" \
            --write \
            --json

      - name: Verify current-head Codex E2E attestation
        uses: actions/github-script@v7
        env:
          RELEASE_ISSUE: ${{ inputs.release_issue }}
        with:
          script: |
            const fs = require("fs");
            const issueNumber = Number(process.env.RELEASE_ISSUE);
            const marker = /^<!-- loom:codex-e2e-attestation (\{.*\}) -->$/m;
            const trustedPermissions = new Set(["admin", "maintain", "write"]);
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              per_page: 100,
            });
            const matching = [];
            for (const comment of comments) {
              const match = String(comment.body || "").match(marker);
              if (!match) continue;
              try {
                const payload = JSON.parse(match[1]);
                if (payload?.source_head === context.sha) matching.push({ comment, payload });
              } catch (error) {}
            }
            if (matching.length !== 1) {
              core.setFailed(`issue:${issueNumber} requires exactly one current-head Codex E2E attestation; found ${matching.length}`);
              return;
            }
            const { comment, payload } = matching[0];
            if (comment.user?.type !== "User" || typeof comment.user?.login !== "string") {
              core.setFailed("Codex E2E attestation must be authored by a trusted repository maintainer");
              return;
            }
            const { data: permission } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: comment.user.login,
            });
            if (!trustedPermissions.has(permission.permission) || permission.user?.id !== comment.user.id || permission.user?.login !== comment.user.login) {
              core.setFailed("Codex E2E attestation author does not have authenticated repository write permission");
              return;
            }
            const releaseVersion = fs.readFileSync("VERSION", "utf8").trim().replace(/^v/, "");
            const manifest = JSON.parse(fs.readFileSync("plugins/loom/.codex-plugin/plugin.json", "utf8"));
            const pluginMetadata = manifest?.["x-loom"] || {};
            const canonicalHash = pluginMetadata.plugin_payload_hash;
            const pluginPayloadVersion = pluginMetadata.plugin_payload_version;
            const sourcePackageVersion = pluginMetadata.source_package_version;
            const observedAt = Date.parse(String(payload?.observed_at || ""));
            const expectedSkills = Array.isArray(payload?.loaded_skills) &&
              payload.loaded_skills.length === 2 && payload.loaded_skills.includes("loom-init") && payload.loaded_skills.includes("loom-review");
            const fixture = payload?.clean_fixture || {};
            const valid =
              payload?.schema_version === "loom-codex-e2e-attestation/v1" &&
              payload?.source_head === context.sha && payload?.reviewed_head === context.sha &&
              /^019[0-9a-f-]{33}$/i.test(String(payload?.codex_thread_id || "")) &&
              payload?.candidate_cli_authority === "source-package" && payload?.plugin_loaded === true &&
              payload?.plugin_version === releaseVersion && pluginPayloadVersion === releaseVersion &&
              sourcePackageVersion === releaseVersion && /^[0-9a-f]{64}$/.test(String(canonicalHash || "")) &&
              payload?.plugin_payload_hash === canonicalHash &&
              payload?.canonical_plugin_payload_hash === canonicalHash && expectedSkills &&
              payload?.public_command_count === 30 && payload?.hidden_compatibility_command_count === 0 &&
              fixture.detect === "pass" && fixture.doctor === "pass" && fixture.verify === "pass" &&
              payload?.semantic_review_verdict === "passed" && payload?.mutates === false &&
              Number.isFinite(observedAt) && observedAt <= Date.now() && Date.now() - observedAt <= 86400000;
            if (!valid) {
              core.setFailed("current-head Codex E2E attestation is stale, incomplete, or did not pass the candidate product surface");
              return;
            }
            core.notice(`consumed Codex E2E attestation comment ${comment.id} for ${context.sha}`);

      - name: Run umbrella product acceptance checks
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 tools/check_light_profile.py
          python3 tools/check_release_admission.py
          python3 tools/check_product_acceptance_adapter.py
          python3 tools/check_npm_package.py --surface aggregate
          python3 tools/check_release_surface.py --surface installed-global-cli-smoke

      - name: Write host-bound umbrella acceptance record
        env:
          STORY: ${{ github.repository }}/issue/${{ inputs.release_issue }}
          EVIDENCE_CLASS: process_runtime
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          VERIFIER_LOGIN: ${{ github.triggering_actor }}
          VERIFIER_ID: ${{ steps.authority.outputs.verifier_id }}
        run: |
          VERSION=$(tr -d '\n' < VERSION)
          python3 tools/write_product_acceptance.py \
            --story "$STORY" \
            --scenario "${VERSION}-umbrella-release-acceptance" \
            --evidence-class "$EVIDENCE_CLASS" \
            --provider-profile "loom-${VERSION}-umbrella" \
            --repository "$REPOSITORY" \
            --head-sha "$HEAD_SHA" \
            --run-id "$RUN_ID" \
            --verifier-login "$VERIFIER_LOGIN" \
            --verifier-id "$VERIFIER_ID" \
            --output acceptance.json

      - name: Upload product acceptance
        id: acceptance_upload
        uses: actions/upload-artifact@v4
        with:
          name: loom-product-acceptance
          path: acceptance.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish release Work Item artifact locator
        uses: actions/github-script@v7
        env:
          RELEASE_ISSUE: ${{ inputs.release_issue }}
          ARTIFACT_ID: ${{ steps.acceptance_upload.outputs.artifact-id }}
          HEAD_SHA: ${{ github.sha }}
        with:
          script: |
            const fs = require("fs");
            const issueNumber = Number(process.env.RELEASE_ISSUE);
            const artifactId = Number(process.env.ARTIFACT_ID);
            const version = fs.readFileSync("VERSION", "utf8").trim();
            if (!Number.isInteger(issueNumber) || !Number.isInteger(artifactId) || artifactId <= 0) {
              core.setFailed("acceptance upload did not return a valid release issue/artifact binding");
              return;
            }
            const { data: artifact } = await github.rest.actions.getArtifact({
              owner: context.repo.owner,
              repo: context.repo.repo,
              artifact_id: artifactId,
            });
            if (artifact.id !== artifactId || artifact.name !== "loom-product-acceptance" || artifact.expired || artifact.workflow_run?.id !== context.runId) {
              core.setFailed("uploaded acceptance artifact readback does not match this workflow run");
              return;
            }
            const marker = `<!-- loom:product-acceptance-artifact id:${artifactId} -->`;
            const body = `${marker}\n\n${version} umbrella 产品验收已绑定 GitHub host artifact。workflow success 不等于 lifecycle closure completed。\n\n- Head: \`${process.env.HEAD_SHA}\`\n- Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const markerPattern = /<!--\s*loom:product-acceptance-artifact\s+id:\d+\s*-->/i;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              per_page: 100,
            });
            const markerComments = comments.filter((comment) => comment.user?.login === "github-actions[bot]" && markerPattern.test(String(comment.body || "")));
            if (markerComments.length > 1) {
              core.setFailed(`issue:${issueNumber} has ambiguous workflow-owned product acceptance locators`);
              return;
            }
            let written;
            if (markerComments.length === 1) {
              ({ data: written } = await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: markerComments[0].id,
                body,
              }));
            } else {
              ({ data: written } = await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body,
              }));
            }
            const { data: readback } = await github.rest.issues.getComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: written.id,
            });
            const finalComments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              per_page: 100,
            });
            const finalMarkers = finalComments.filter((comment) => comment.user?.login === "github-actions[bot]" && markerPattern.test(String(comment.body || "")));
            if (readback.user?.login !== "github-actions[bot]" || readback.body !== body || finalMarkers.length !== 1 || finalMarkers[0].id !== readback.id) {
              core.setFailed(`issue:${issueNumber} product acceptance locator readback is incomplete or ambiguous`);
            }
