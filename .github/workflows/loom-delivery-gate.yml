name: loom-delivery-gate

on:
  pull_request:
  merge_group:
  workflow_call:
    inputs:
      host_facts:
        description: Host-native facts matching loom-delivery-gate-host-facts/v1.
        required: true
        type: string
      profile:
        description: Required delivery profile (light, standard, or reinforced).
        required: true
        type: string
      validation_command:
        description: Space-delimited allowlisted Make targets; shell commands and expressions are rejected.
        required: true
        type: string
      loom_ref:
        description: Required 40-character Loom commit SHA used as the canonical evaluator source.
        required: true
        type: string
      enforcement:
        description: "Required delivery-gate mode: advisory records the result; enforce fails a non-passing terminal check."
        required: true
        type: string
    outputs:
      result:
        description: Advisory, passed, or blocked delivery-gate terminal result.
        value: ${{ jobs.loom-delivery-gate.outputs.result }}
      enforcement:
        description: Effective delivery-gate enforcement mode.
        value: ${{ jobs.loom-delivery-gate.outputs.enforcement }}
      primary_cause:
        description: Product acceptance remains outside this delivery gate.
        value: ${{ jobs.loom-delivery-gate.outputs.primary_cause }}
      failure_envelope:
        description: JSON failure envelope with exactly one primary cause; product acceptance remains outside this delivery gate.
        value: ${{ jobs.loom-delivery-gate.outputs.failure_envelope }}

jobs:
  loom-delivery-gate:
    name: loom-delivery-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      result: ${{ steps.terminal.outputs.result }}
      enforcement: ${{ steps.terminal.outputs.enforcement }}
      primary_cause: ${{ steps.terminal.outputs.primary_cause }}
      failure_envelope: ${{ steps.terminal.outputs.failure_envelope }}
    concurrency:
      group: loom-delivery-gate-${{ github.event.pull_request.number || github.event.merge_group.head_ref || github.run_id }}
      cancel-in-progress: true
    steps:
      - name: Read GitHub host facts
        id: host-facts
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          HOST_FACTS_PATH: ${{ runner.temp }}/loom-delivery-host-facts.json
          CHANGED_PATHS_PATH: ${{ runner.temp }}/loom-delivery-changed-paths.txt
          WORKFLOW_CALL_HOST_FACTS: ${{ inputs.host_facts }}
          WORKFLOW_CALL_PROFILE: ${{ inputs.profile }}
          WORKFLOW_CALL_VALIDATION_COMMAND: ${{ inputs.validation_command }}
          WORKFLOW_CALL_LOOM_REF: ${{ inputs.loom_ref }}
          WORKFLOW_CALL_ENFORCEMENT: ${{ inputs.enforcement }}
          REUSABLE_MODE: ${{ inputs.loom_ref != '' }}
        with:
          script: |
            const fs = require("fs");
            const event = context.eventName;
            const reusable = process.env.REUSABLE_MODE === "true";
            const repository = { owner: context.repo.owner, name: context.repo.repo };
            const apiRepository = { owner: context.repo.owner, repo: context.repo.repo };
            const facts = {
              schema_version: "loom-delivery-gate-host-facts/v1",
              event,
              repository,
              changed_paths: [],
            };
            try {
              if (reusable) {
                if (!/^[0-9a-f]{40}$/i.test(process.env.WORKFLOW_CALL_LOOM_REF || "")) {
                  throw new Error("reusable loom_ref must be a 40-character commit SHA");
                }
                const supplied = JSON.parse(process.env.WORKFLOW_CALL_HOST_FACTS || "");
                if (!supplied || typeof supplied !== "object" || Array.isArray(supplied)) {
                  throw new Error("reusable host_facts must be a JSON object");
                }
                Object.assign(facts, supplied);
                if (process.env.WORKFLOW_CALL_PROFILE) {
                  facts.profile = process.env.WORKFLOW_CALL_PROFILE;
                }
              } else if (event === "pull_request") {
                const pull = context.payload.pull_request;
                const files = await github.paginate(github.rest.pulls.listFiles, {
                  ...apiRepository,
                  pull_number: context.payload.number,
                  per_page: 100,
                });
                facts.change = { base_sha: pull.base.sha, head_sha: pull.head.sha, number: context.payload.number };
                facts.changed_paths = files.map((file) => file.filename);
              } else if (event === "merge_group") {
                const group = context.payload.merge_group;
                const comparison = await github.rest.repos.compareCommits({
                  ...apiRepository,
                  base: group.base_sha,
                  head: group.head_sha,
                  per_page: 100,
                });
                facts.change = { base_sha: group.base_sha, head_sha: group.head_sha, head_ref: group.head_ref };
                facts.changed_paths = (comparison.data.files || []).map((file) => file.filename);
              }
            } catch (error) {
              const message = String(error.message || error);
              if ([401, 403].includes(Number(error.status))) {
                facts.permission_error = message;
              } else if (event === "merge_group" && [404, 409, 422].includes(Number(error.status))) {
                facts.git_history_error = message;
              } else {
                facts.host_read_error = message;
              }
              core.warning(message);
            }
            if (reusable) {
              facts.validation_command = process.env.WORKFLOW_CALL_VALIDATION_COMMAND || "";
            }
            const changedPaths = Array.isArray(facts.changed_paths) ? [...new Set(facts.changed_paths)].sort() : [];
            fs.writeFileSync(process.env.HOST_FACTS_PATH, `${JSON.stringify(facts)}\n`, "utf8");
            fs.writeFileSync(process.env.CHANGED_PATHS_PATH, changedPaths.length ? `${changedPaths.join("\n")}\n` : "", "utf8");

      - name: Checkout canonical Loom source for reusable callers
        if: ${{ always() && inputs.loom_ref != '' }}
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: MC-and-his-Agents/Loom
          ref: ${{ inputs.loom_ref }}
          fetch-depth: 1
          path: loom
          persist-credentials: false

      - name: Checkout trusted Loom base for direct validation
        if: ${{ always() && inputs.loom_ref == '' }}
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          fetch-depth: 1
          path: loom
          persist-credentials: false

      - name: Checkout untrusted candidate validation tree
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          fetch-depth: 1
          path: candidate
          persist-credentials: false

      - name: Evaluate delivery facts
        id: evaluate
        if: ${{ always() }}
        continue-on-error: true
        shell: bash
        env:
          HOST_FACTS_PATH: ${{ runner.temp }}/loom-delivery-host-facts.json
          DELIVERY_GATE_PLAN_PATH: ${{ runner.temp }}/loom-delivery-gate-plan.json
          LOOM_SOURCE_PATH: loom
          CANDIDATE_PATH: candidate
          DELIVERY_GATE_ENFORCEMENT: ${{ inputs.loom_ref != '' && inputs.enforcement || 'enforce' }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -u
          python3 "$LOOM_SOURCE_PATH/src/skills/shared/scripts/delivery_gate.py" --host-facts-file "$HOST_FACTS_PATH" --candidate-path "$CANDIDATE_PATH" --enforcement "$DELIVERY_GATE_ENFORCEMENT" --output "$DELIVERY_GATE_PLAN_PATH"
          python3 - "$DELIVERY_GATE_PLAN_PATH" "$LOOM_SOURCE_PATH/src/skills/shared/scripts" "$HOST_FACTS_PATH" "$GITHUB_OUTPUT" <<'PY'
          import hashlib
          import json
          import sys

          from pathlib import Path

          plan_path, source_root, host_facts_path, output_path = map(Path, sys.argv[1:])
          targets = json.loads(plan_path.read_text(encoding="utf-8"))["native_validation"]["targets"]
          digest = hashlib.sha256()
          for path in sorted(source_root.glob("*.py")):
              digest.update(path.name.encode("utf-8"))
              digest.update(b"\0")
              digest.update(path.read_bytes())
          with output_path.open("a", encoding="utf-8") as stream:
              stream.write(f"validation_targets={json.dumps(targets, separators=(',', ':'))}\n")
              stream.write(f"trusted_evaluator_sha256={digest.hexdigest()}\n")
              stream.write(f"host_facts_sha256={hashlib.sha256(host_facts_path.read_bytes()).hexdigest()}\n")
          PY

      - name: Run selected native validation with read-only token
        if: ${{ always() }}
        continue-on-error: true
        shell: bash
        env:
          VALIDATION_TARGETS_JSON: ${{ steps.evaluate.outputs.validation_targets }}
          CANDIDATE_PATH: candidate
        run: |
          set -u
          VALIDATION_RESULT_PATH="${{ runner.temp }}/loom-delivery-native-validation.json"
          (
            cd "$CANDIDATE_PATH"
            python3 - "$VALIDATION_TARGETS_JSON" "$VALIDATION_RESULT_PATH" <<'PY'
          import json
          import os
          import re
          import subprocess
          import sys

          try:
              targets = json.loads(sys.argv[1])
          except (json.JSONDecodeError, TypeError):
              targets = []
          valid = isinstance(targets, list) and bool(targets) and all(
              isinstance(target, str) and re.fullmatch(r"[a-z0-9][a-z0-9-]*", target)
              for target in targets
          )
          if not valid:
              status = "command_missing"
          else:
              completed = subprocess.run(["make", "--", *targets], check=False)
              status = "passed" if completed.returncode == 0 else "failed"
          with open(sys.argv[2], "w", encoding="utf-8") as stream:
              json.dump({"status": status}, stream)
              stream.write("\n")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              stream.write(f"status={status}\n")
          PY
          )

      - name: Finalize advisory delivery result
        id: finalize
        if: ${{ always() }}
        continue-on-error: true
        shell: bash
        env:
          HOST_FACTS_PATH: ${{ runner.temp }}/loom-delivery-host-facts.json
          VALIDATION_RESULT_PATH: ${{ runner.temp }}/loom-delivery-native-validation.json
          DELIVERY_GATE_PATH: ${{ runner.temp }}/loom-delivery-gate.json
          LOOM_SOURCE_PATH: loom
          CANDIDATE_PATH: candidate
          DELIVERY_GATE_ENFORCEMENT: ${{ inputs.loom_ref != '' && inputs.enforcement || 'enforce' }}
          EXPECTED_EVALUATOR_SHA256: ${{ steps.evaluate.outputs.trusted_evaluator_sha256 }}
          EXPECTED_HOST_FACTS_SHA256: ${{ steps.evaluate.outputs.host_facts_sha256 }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -u
          python3 - "$LOOM_SOURCE_PATH/src/skills/shared/scripts" "$HOST_FACTS_PATH" <<'PY'
          import hashlib
          import os
          import sys

          from pathlib import Path

          source_root = Path(sys.argv[1])
          digest = hashlib.sha256()
          for path in sorted(source_root.glob("*.py")):
              digest.update(path.name.encode("utf-8"))
              digest.update(b"\0")
              digest.update(path.read_bytes())
          if digest.hexdigest() != os.environ.get("EXPECTED_EVALUATOR_SHA256"):
              raise SystemExit("trusted evaluator changed during candidate validation")
          if hashlib.sha256(Path(sys.argv[2]).read_bytes()).hexdigest() != os.environ.get("EXPECTED_HOST_FACTS_SHA256"):
              raise SystemExit("host facts changed during candidate validation")
          PY
          python3 "$LOOM_SOURCE_PATH/src/skills/shared/scripts/delivery_gate.py" \
            --host-facts-file "$HOST_FACTS_PATH" \
            --validation-result-file "$VALIDATION_RESULT_PATH" \
            --candidate-path "$CANDIDATE_PATH" \
            --enforcement "$DELIVERY_GATE_ENFORCEMENT" \
            --output "$DELIVERY_GATE_PATH"
          python3 - "$DELIVERY_GATE_PATH" "$GITHUB_OUTPUT" <<'PY'
          import hashlib
          import sys

          from pathlib import Path

          result_path, output_path = map(Path, sys.argv[1:])
          with output_path.open("a", encoding="utf-8") as stream:
              stream.write(f"delivery_gate_sha256={hashlib.sha256(result_path.read_bytes()).hexdigest()}\n")
          PY

      - name: Publish terminal delivery result
        id: terminal
        if: ${{ always() }}
        uses: actions/github-script@v7
        env:
          DELIVERY_GATE_PATH: ${{ runner.temp }}/loom-delivery-gate.json
          DELIVERY_GATE_ENFORCEMENT: ${{ inputs.loom_ref != '' && inputs.enforcement || 'enforce' }}
          EXPECTED_DELIVERY_GATE_SHA256: ${{ steps.finalize.outputs.delivery_gate_sha256 }}
        with:
          script: |
            const fs = require("fs");
            const crypto = require("crypto");
            let payload = null;
            try {
              const encoded = fs.readFileSync(process.env.DELIVERY_GATE_PATH);
              const actual = crypto.createHash("sha256").update(encoded).digest("hex");
              if (!process.env.EXPECTED_DELIVERY_GATE_SHA256 || actual !== process.env.EXPECTED_DELIVERY_GATE_SHA256) {
                throw new Error("delivery gate result changed after trusted finalization");
              }
              payload = JSON.parse(encoded.toString("utf8"));
            } catch (error) {
              core.warning(`delivery evaluator output unavailable: ${String(error.message || error)}`);
            }
            const profile = payload?.delivery?.profile || "standard";
            const fallbackCause = {
              id: "environment_unavailable",
              failure_domain: "environment",
              code: "unavailable",
              locator: "delivery_gate:evaluator_output",
              summary: "The delivery-gate evaluator did not produce readable output.",
              owner: "ci",
              retryable: true,
              cause_class: "unavailable",
              transient: true,
              details: {},
              consequence_of: [],
              remediation_command: "rerun loom-delivery-gate after the execution environment is available",
            };
            const cause = payload?.primary_cause?.id || fallbackCause.id;
            const failureEnvelope = payload?.failure_envelope || { schema_version: "loom-failure-envelope/v1", primary_cause: payload?.primary_cause || fallbackCause, consequences: [], suppressed_diagnostics: [], secondary_causes: [] };
            const enforcement = payload?.enforcement || process.env.DELIVERY_GATE_ENFORCEMENT || "advisory";
            const result = payload?.result || (enforcement === "advisory" ? "advisory" : "blocked");
            core.setOutput("result", result);
            core.setOutput("enforcement", enforcement);
            core.setOutput("primary_cause", cause);
            core.setOutput("failure_envelope", JSON.stringify(failureEnvelope));
            core.notice(`loom-delivery-gate enforcement=${enforcement} profile=${profile}; primary cause=${cause}; remediation=${failureEnvelope.primary_cause?.remediation_command || "unavailable"}`);
            await core.summary
              .addHeading("Loom delivery gate")
              .addRaw(`Enforcement: ${enforcement}\n\nResult: ${result}\n\nProfile: ${profile}\n\nPrimary cause: ${cause}\n\nFailure envelope:\n\n\`\`\`json\n${JSON.stringify(failureEnvelope, null, 2)}\n\`\`\`\n\nProduct acceptance: not_evaluated.`)
              .write();
            if (result === "blocked") {
              core.setFailed(`loom-delivery-gate blocked: ${cause}`);
            }
