name: loom-check

on:
  push:
  pull_request:
  merge_group:

jobs:
  py-compile:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Compile Loom entrypoints
        run: python3 -m py_compile tools/loom_init.py tools/loom_flow.py tools/loom_check.py skills/shared/scripts/*.py skills/loom-init/scripts/*.py skills/loom-adopt/scripts/*.py skills/loom-resume/scripts/*.py skills/loom-pre-review/scripts/*.py skills/loom-review/scripts/*.py skills/loom-handoff/scripts/*.py skills/loom-retire/scripts/*.py skills/loom-merge-ready/scripts/*.py

  demo-bootstrap:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Rebuild demo bootstrap
        run: make loom-demo-new-project

  repo-local-cli:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Rebuild demo bootstrap
        run: make loom-demo-new-project
      - name: Run repo-local demo CLI
        run: |
          cd examples/new-project
          python3 .loom/bin/loom_init.py runtime-state --target .
          python3 .loom/bin/loom_init.py verify --target .
          python3 .loom/bin/loom_init.py fact-chain --target .
          python3 .loom/bin/loom_flow.py runtime-state --target . --item INIT-0001
          python3 .loom/bin/loom_flow.py fact-chain --target . --item INIT-0001
          python3 .loom/bin/loom_flow.py runtime-evidence --target . --item INIT-0001
          python3 .loom/bin/loom_flow.py state-check --target . --item INIT-0001
          python3 .loom/bin/loom_flow.py flow pre-review --target . --item INIT-0001
          python3 .loom/bin/loom_flow.py checkpoint admission --target . --item INIT-0001
          python3 .loom/bin/loom_flow.py workspace locate --target . --item INIT-0001
          python3 .loom/bin/loom_flow.py purity-check --target . --item INIT-0001
      - name: Runtime-state scene conflict must fail closed
        run: |
          if LOOM_SOURCE_REPO_ROOT="$PWD" LOOM_INSTALLED_SKILLS_ROOT="$PWD/skills" LOOM_RUNTIME_SCENE=upgrade-rehearsal python3 skills/shared/scripts/loom_flow.py runtime-state --target examples/new-project --item INIT-0001; then
            echo "expected runtime-state conflict to fail closed"
            exit 1
          fi

  root-self-governance:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate root self-governance carrier
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .loom/bin/loom_init.py verify --target .
          python3 .loom/bin/loom_flow.py governance-profile status --target .
          python3 .loom/bin/loom_flow.py runtime-parity validate --target .
          python3 .loom/bin/loom_flow.py adopt verify --target . --item INIT-0001
          python3 .loom/bin/loom_flow.py carrier refresh --target . --dry-run

  loom-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run loom check
        env:
          GH_TOKEN: ${{ github.token }}
        run: make loom-check
