name: loom-check

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:

concurrency:
  group: loom-check-${{ github.event.pull_request.number || github.event.merge_group.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  py-compile:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Compile Loom entrypoints
        run: make py-compile

  host-native-lifecycle:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check host-native lifecycle contracts
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: make loom-check
